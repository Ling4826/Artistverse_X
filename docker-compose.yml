version: '3.8'

services:
  # Python Flask Backend Service
  backend:
    build:
      context: ./Backend_Artistverse_X
      dockerfile: Dockerfile
    container_name: artistverse-backend
    restart: always
    env_file:
      - .env
    ports:
      - "5005:5005"
    networks:
      - artistverse-network

  # Vue 3 Nginx Frontend Service
  frontend:
    build:
      context: ./Frontend_Artistverse_X
      dockerfile: Dockerfile
    container_name: artistverse-frontend
    restart: always
    ports:
      - "8080:80"
      - "80:80"
    depends_on:
      - backend
    networks:
      - artistverse-network

networks:
  artistverse-network:
    driver: bridge
