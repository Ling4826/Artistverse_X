version: '3.8'

services:
  mysql:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-ArtistverseX}
      MYSQL_DATABASE: ${DB_NAME:-ArtistverseX}
    volumes:
      - mysql-data-v5:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "10692:80"

  backend:
    image: lingth/artistverse_x-backend:latest
    build: ./Backend_Artistverse_X
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:-ArtistverseX}
      - DB_NAME=${DB_NAME:-ArtistverseX}
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID:-}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET:-}
      - REDIRECT_URI=${REDIRECT_URI:-}

  frontend:
    image: lingth/artistverse_x-frontend:latest
    build: ./Frontend_Artistverse_X
    ports:
      - "10690:3000"

volumes:
  mysql-data-v5:
    driver: local
